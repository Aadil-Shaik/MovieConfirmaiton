# Each rule watches one movie at one cinema.
#
# Modes (District-only rules alert the first time shows appear, even on the first run):
#   target_date: "2026-12-20"   only that date (used below)
#   no target date              any date; alerts again when new dates are added
#   target_weekday: saturday    next upcoming Saturday (older mode, also supports BookMyShow)
#
# match: phrases that must appear in District's title (whole words, case-insensitive).
#   Keeps "Dune: Part Three" from matching a "Dune: Part Two" re-release, and
#   "Godzilla Minus Zero" from matching "Godzilla x Kong".
# from_date: (any-date rules) ignore listings before this date.
# watch_until: stop checking after this date.

rules:
  - id: doomsday-moa
    movie: "Avengers: Doomsday"
    match: ["avengers doomsday"]
    cinema:
      name: "INOX Megaplex Mall of Asia"
      district:
        cinema_id: "1025975"
        slug: "inox-megaplex-mall-of-asia-byatarayanapura-bengaluru-CD1025975"
    target_date: "2026-12-20"   # Sunday
    watch_until: "2026-12-20"
    platforms: [district]
    links:
      district: "https://www.district.in/movies/inox-megaplex-mall-of-asia-byatarayanapura-bengaluru-CD1025975"

  - id: dune3-moa
    movie: "Dune: Part Three"
    match: ["dune part three", "dune part 3", "dune 3"]
    cinema:
      name: "INOX Megaplex Mall of Asia"
      district:
        cinema_id: "1025975"
        slug: "inox-megaplex-mall-of-asia-byatarayanapura-bengaluru-CD1025975"
    target_date: "2026-12-20"   # Sunday
    watch_until: "2026-12-20"
    platforms: [district]
    links:
      district: "https://www.district.in/movies/inox-megaplex-mall-of-asia-byatarayanapura-bengaluru-CD1025975"

  - id: godzilla-minus-zero-park-square
    movie: "Godzilla Minus Zero"
    match: ["godzilla minus zero", "godzilla minus 0"]
    cinema:
      name: "PVR Aura Park Square, Whitefield"
      district:
        cinema_id: "1022308"
        slug: "pvr-aura-park-square-whitefield-bengaluru-CD1022308"
    target_date: "2026-11-20"   # Friday, release day
    watch_until: "2026-11-20"
    platforms: [district]
    links:
      district: "https://www.district.in/movies/pvr-aura-park-square-whitefield-bengaluru-CD1022308"

  # Example of a specific-date rule (also supports BookMyShow, which currently 403s scripts):
